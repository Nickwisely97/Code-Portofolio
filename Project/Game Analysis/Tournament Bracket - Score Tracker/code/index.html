<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Bracket &amp; Score Tracker</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #dde1e6;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --accent-soft: #eaf1ff;
    --danger: #dc2626;
    --danger-soft: #fdecec;
    --win: #16a34a;
    --win-soft: #eafaf0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header.topbar h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
  }
  nav.tabs {
    display: flex;
    gap: 8px;
  }
  nav.tabs button {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  nav.tabs button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  nav.tabs button:not(.active):hover {
    background: var(--accent-soft);
  }
  .topbar-actions {
    display: flex;
    gap: 10px;
  }
  main {
    padding: 22px 24px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .view { display: none; }
  .view.active { display: block; }

  /* ---- Buttons ---- */
  button { font-family: inherit; }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: #f0f1f3; }
  .btn-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid #f5c6c6; }
  .btn-danger:hover { background: #fbdada; }
  .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ---- Bracket view ---- */
  .bracket-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .bracket-toolbar h2 { margin: 0; font-size: 20px; }
  .bracket-generator {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bracket-generator select {
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
  }
  .rounds-row {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    padding-bottom: 12px;
  }
  .round-col {
    min-width: 300px;
    flex: 0 0 auto;
  }
  .round-col h3 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    margin: 0 0 10px 4px;
  }
  .match-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(16,24,40,.04);
  }
  .match-card.is-active {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .match-card.is-done {
    border-color: var(--win);
  }
  .match-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .match-card-head .status-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    background: #eef0f3;
    color: var(--muted);
  }
  .match-card.is-active .status-badge { background: var(--accent-soft); color: var(--accent-dark); }
  .match-card.is-done .status-badge { background: var(--win-soft); color: var(--win); }
  .icon-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .icon-btn:hover { background: var(--danger-soft); color: var(--danger); }

  .team-row {
    display: grid;
    grid-template-columns: 1fr 40px 40px 40px;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .team-row input.team-name {
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 9px;
    font-size: 14px;
    font-weight: 600;
    width: 100%;
  }
  .team-row input.team-name:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .game-box {
    border: 1px solid var(--border);
    border-radius: 7px;
    text-align: center;
    padding: 6px 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    background: #fafbfc;
  }
  .game-box.empty { color: #c3c8d1; font-weight: 400; }
  .game-box.live {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-dark);
  }
  .game-box.live::after {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 4px;
    border-radius: 50%;
    background: var(--accent);
    animation: live-pulse 1s infinite;
    vertical-align: middle;
  }
  @keyframes live-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .25; }
  }
  .game-headers {
    display: grid;
    grid-template-columns: 1fr 40px 40px 40px;
    gap: 6px;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 4px;
  }
  .game-headers span:first-child { text-align: left; }

  .match-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .winner-line {
    font-size: 12px;
    font-weight: 700;
    color: var(--win);
  }
  .empty-hint {
    color: var(--muted);
    font-size: 13px;
    padding: 30px 10px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }

  /* ---- Games view ---- */
  .games-empty {
    text-align: center;
    padding: 90px 20px;
    color: var(--muted);
  }
  .games-empty .big { font-size: 40px; margin-bottom: 10px; }
  .scoreboard-wrap { max-width: 820px; margin: 0 auto; }
  .scoreboard-header {
    text-align: center;
    margin-bottom: 6px;
  }
  .scoreboard-header .round-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .scoreboard-header .game-label {
    font-size: 14px;
    color: var(--muted);
    margin-top: 4px;
  }
  .done-banner {
    background: var(--win-soft);
    color: var(--win);
    border: 1px solid #bfe8cc;
    border-radius: 10px;
    padding: 12px 16px;
    text-align: center;
    font-weight: 700;
    margin: 16px 0;
  }
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 18px;
    align-items: center;
    margin: 22px 0;
  }
  .team-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 18px;
    text-align: center;
  }
  .team-panel .team-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 14px;
    word-break: break-word;
  }
  .team-panel .score-num {
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 18px;
    font-variant-numeric: tabular-nums;
  }
  .score-btns { display: flex; justify-content: center; gap: 10px; }
  .score-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
  }
  .score-btn.plus { background: var(--accent); }
  .score-btn.plus:hover { background: var(--accent-dark); }
  .score-btn.minus { background: #94a3b8; }
  .score-btn.minus:hover { background: #7c8ba1; }
  .vs-label {
    font-weight: 800;
    color: var(--muted);
    font-size: 14px;
  }
  .game-history {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .game-history span { margin: 0 8px; }
  .scoreboard-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .team-panel input.team-title-input {
    display: block;
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 14px;
    border-radius: 6px;
    padding: 4px 6px;
    color: var(--text);
    font-family: inherit;
  }
  .team-panel input.team-title-input:hover { border-color: var(--border); }
  .team-panel input.team-title-input:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }
  .team-panel input.score-num-input {
    display: block;
    width: 100%;
    border: none;
    background: transparent;
    text-align: center;
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 18px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    font-family: inherit;
    appearance: textfield;
    -moz-appearance: textfield;
  }
  .team-panel input.score-num-input::-webkit-outer-spin-button,
  .team-panel input.score-num-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .team-panel input.score-num-input:focus {
    outline: 2px solid var(--accent-soft);
    border-radius: 8px;
  }
  .team-panel input.score-num-input:disabled { color: var(--text); opacity: 1; }

  /* ---- Mode select screen ---- */
  .mode-select-wrap { max-width: 720px; margin: 60px auto; text-align: center; }
  .mode-select-wrap h2 { margin: 0 0 8px; font-size: 26px; }
  .mode-select-desc { color: var(--muted); margin: 0 0 32px; }
  .mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .mode-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 20px;
    cursor: pointer;
    text-align: center;
    transition: border-color .15s, box-shadow .15s, transform .1s;
    font-family: inherit;
  }
  .mode-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 14px rgba(37,99,235,.12);
    transform: translateY(-2px);
  }
  .mode-card-icon { font-size: 40px; margin-bottom: 12px; }
  .mode-card-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .mode-card-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
  @media (max-width: 600px) { .mode-cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="topbar">
  <h1>🏆 Tournament Bracket &amp; Score Tracker</h1>
  <nav class="tabs" id="mode-tabs" style="display:none;">
    <button id="tab-bracket" class="active" data-view="bracket">Bracket</button>
    <button id="tab-games" data-view="games">Games</button>
  </nav>
  <div class="topbar-actions">
    <button class="btn btn-secondary btn-sm" id="btn-change-mode" style="display:none;">🔀 Ganti Mode</button>
    <button class="btn btn-danger btn-sm" id="btn-reset-all">Reset Semua Data</button>
  </div>
</header>

<main>
  <!-- ================= MODE SELECT VIEW ================= -->
  <section id="view-mode-select" class="view active">
    <div class="mode-select-wrap">
      <h2>Pilih Mode</h2>
      <p class="mode-select-desc">Pilih cara kamu ingin menggunakan aplikasi ini.</p>
      <div class="mode-cards">
        <button class="mode-card" id="btn-mode-single">
          <div class="mode-card-icon">🎯</div>
          <div class="mode-card-title">Single Game</div>
          <div class="mode-card-desc">Langsung hitung skor satu pertandingan, tanpa bracket. Cocok untuk pertandingan tunggal seperti tenis meja satu lawan satu.</div>
        </button>
        <button class="mode-card" id="btn-mode-multiple">
          <div class="mode-card-icon">🏆</div>
          <div class="mode-card-title">Multiple Game</div>
          <div class="mode-card-desc">Buat bracket turnamen penuh dengan banyak babak dan pertandingan.</div>
        </button>
      </div>
    </div>
  </section>

  <!-- ================= BRACKET VIEW ================= -->
  <section id="view-bracket" class="view">
    <div class="bracket-toolbar">
      <h2>Bracket Turnamen</h2>
      <div class="bracket-generator">
        <select id="bracket-size-select">
          <option value="4">4 Tim</option>
          <option value="8" selected>8 Tim (Perempat Final)</option>
          <option value="16">16 Tim</option>
          <option value="32">32 Tim</option>
        </select>
        <button class="btn btn-primary" id="btn-generate-bracket">🔄 Buat Bracket Baru</button>
      </div>
    </div>
    <div id="rounds-container" class="rounds-row"></div>
  </section>

  <!-- ================= GAMES VIEW ================= -->
  <section id="view-games" class="view">
    <div id="games-container"></div>
  </section>
</main>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "bracket-score-tracker-state-v1";

  const ROUND_ORDER = {
    "babak 64 besar": 0,
    "babak 32 besar": 1,
    "babak 16 besar": 2,
    "perempat final (8 besar)": 3,
    "perempat final": 3,
    "8 besar": 3,
    "quarter final": 3,
    "semifinal": 4,
    "final": 5,
  };

  function roundRank(name) {
    const key = (name || "").trim().toLowerCase();
    if (key in ROUND_ORDER) return ROUND_ORDER[key];
    return 100;
  }

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function makeEmptyMatch(round, teamA, teamB) {
    return {
      id: uid(),
      round: round,
      createdAt: Date.now(),
      teamA: teamA,
      teamB: teamB,
      games: [null, null, null],       // committed {a,b} per game slot, or null
      live: { a: 0, b: 0 },             // in-progress score for the current game
      currentGameIndex: 0,              // 0, 1, or 2
      status: "pending",                // pending | in_progress | done
      winner: null,                     // "A" | "B" | null
      nextMatchId: null,                // match the winner advances into, or null (Final)
      nextMatchSlot: null,              // "A" | "B" — which slot of nextMatchId the winner fills
    };
  }

  // ---------------------------------------------------------------------
  // Bracket generation: one "session" creates the whole cascade of rounds
  // (e.g. 8 teams -> Perempat Final x4, Semifinal x2, Final x1), pre-filled
  // with "Tim 1".."Tim N" in the first round, and every match wired to the
  // next-round slot its winner advances into.
  // ---------------------------------------------------------------------
  function roundNameForSize(teamsInRound) {
    if (teamsInRound === 2) return "Final";
    if (teamsInRound === 4) return "Semifinal";
    if (teamsInRound === 8) return "Perempat Final";
    return `Babak ${teamsInRound} Besar`;
  }

  function generateBracket(numTeams) {
    const matches = [];
    let prevRoundMatches = [];
    let teamsInRound = numTeams;
    let teamCounter = 1;
    let isFirstRound = true;

    while (teamsInRound >= 2) {
      const numMatchesThisRound = teamsInRound / 2;
      const roundName = roundNameForSize(teamsInRound);
      const thisRoundMatches = [];

      for (let i = 0; i < numMatchesThisRound; i++) {
        const teamA = isFirstRound ? `Tim ${teamCounter++}` : "";
        const teamB = isFirstRound ? `Tim ${teamCounter++}` : "";
        const m = makeEmptyMatch(roundName, teamA, teamB);
        thisRoundMatches.push(m);
        matches.push(m);
      }

      // Link the previous round's matches into this round: winners of
      // match (2k) and (2k+1) feed into slot A/B of match k here.
      prevRoundMatches.forEach((prevMatch, idx) => {
        const nextMatch = thisRoundMatches[Math.floor(idx / 2)];
        prevMatch.nextMatchId = nextMatch.id;
        prevMatch.nextMatchSlot = idx % 2 === 0 ? "A" : "B";
      });

      prevRoundMatches = thisRoundMatches;
      teamsInRound = numMatchesThisRound;
      isFirstRound = false;
    }

    return matches;
  }

  function ensureDefaultBracket() {
    if (!state.matches || state.matches.length === 0) {
      state.matches = generateBracket(8);
      state.activeMatchId = null;
      saveState();
    }
  }

  // Single Game mode uses one standalone match (not part of the bracket
  // cascade — no nextMatchId, so a finished single game never advances
  // anything). Reused across sessions until Reset Semua Data / mode change.
  function ensureSingleMatch() {
    if (!state.singleMatch) {
      state.singleMatch = makeEmptyMatch("Single Game", "Tim A", "Tim B");
    }
    state.activeMatchId = state.singleMatch.id;
    saveState();
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.matches)) {
          if (parsed.mode === undefined) {
            // Back-compat: state saved before mode selection existed —
            // if it already has a bracket, treat it as Multiple Game mode
            // so returning users aren't dropped back to the mode picker.
            parsed.mode = parsed.matches.length > 0 ? "multiple" : null;
          }
          if (parsed.singleMatch === undefined) parsed.singleMatch = null;
          return parsed;
        }
      }
    } catch (e) {
      console.warn("Gagal memuat state tersimpan, mulai dari kosong.", e);
    }
    return { mode: null, matches: [], activeMatchId: null, currentView: "bracket", singleMatch: null };
  }

  let state = loadState();

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function getActiveMatch() {
    if (state.mode === "single") return state.singleMatch;
    return state.matches.find((m) => m.id === state.activeMatchId) || null;
  }

  function gamesWon(match) {
    let a = 0, b = 0;
    for (const g of match.games) {
      if (!g) continue;
      if (g.a > g.b) a++;
      else if (g.b > g.a) b++;
    }
    return { a, b };
  }

  // ---------------------------------------------------------------------
  // Rendering: Bracket view
  // ---------------------------------------------------------------------
  function renderBracket() {
    const container = document.getElementById("rounds-container");
    if (state.matches.length === 0) {
      container.innerHTML = `<div class="empty-hint" style="width:100%;">
        Belum ada pertandingan. Pilih jumlah tim lalu klik <strong>“🔄 Buat Bracket Baru”</strong>
        untuk membuat seluruh bracket sekaligus (Final, Semifinal, Perempat Final, 16 Besar, dan seterusnya).
      </div>`;
      return;
    }

    // Group matches by round name
    const groups = new Map();
    for (const m of state.matches) {
      if (!groups.has(m.round)) groups.set(m.round, []);
      groups.get(m.round).push(m);
    }

    // Order round columns: known rounds first (small -> final), custom rounds after,
    // ties broken by first-created match in that round.
    const roundNames = Array.from(groups.keys()).sort((r1, r2) => {
      const rank1 = roundRank(r1), rank2 = roundRank(r2);
      if (rank1 !== rank2) return rank1 - rank2;
      const t1 = Math.min(...groups.get(r1).map((m) => m.createdAt));
      const t2 = Math.min(...groups.get(r2).map((m) => m.createdAt));
      return t1 - t2;
    });

    container.innerHTML = roundNames.map((roundName) => {
      const matches = groups.get(roundName).sort((a, b) => a.createdAt - b.createdAt);
      return `
        <div class="round-col">
          <h3>${escapeHtml(roundName)}</h3>
          ${matches.map(renderMatchCard).join("")}
        </div>`;
    }).join("");

    // wire up events for everything just rendered
    container.querySelectorAll("[data-role='team-name']").forEach((el) => {
      el.addEventListener("input", (e) => {
        const id = e.target.getAttribute("data-match-id");
        const side = e.target.getAttribute("data-side");
        const m = state.matches.find((mm) => mm.id === id);
        if (!m) return;
        if (side === "A") m.teamA = e.target.value; else m.teamB = e.target.value;
        saveState();
      });
    });
    container.querySelectorAll("[data-role='delete-match']").forEach((el) => {
      el.addEventListener("click", (e) => {
        const id = e.currentTarget.getAttribute("data-match-id");
        if (!confirm("Hapus pertandingan ini?")) return;
        state.matches = state.matches.filter((m) => m.id !== id);
        if (state.activeMatchId === id) state.activeMatchId = null;
        saveState();
        renderAll();
      });
    });
    container.querySelectorAll("[data-role='score-this']").forEach((el) => {
      el.addEventListener("click", (e) => {
        const id = e.currentTarget.getAttribute("data-match-id");
        state.activeMatchId = id;
        state.currentView = "games";
        saveState();
        renderAll();
      });
    });
  }

  function renderMatchCard(m) {
    const won = gamesWon(m);
    const isActive = state.activeMatchId === m.id;
    const isDone = m.status === "done";
    const bothTeamsSet = m.teamA.trim() && m.teamB.trim();
    const cardClasses = ["match-card"];
    if (isActive) cardClasses.push("is-active");
    if (isDone) cardClasses.push("is-done");

    const statusText = isDone ? "Selesai" : (isActive ? "Sedang Berjalan" : (bothTeamsSet ? "Menunggu" : "Menunggu Tim"));

    // The box for the match's current game slot shows the LIVE in-progress
    // score (while this match is being scored in the Games view) instead of
    // staying blank until "Selesaikan Game" is clicked.
    const gameCell = (idx, side) => {
      const g = m.games[idx];
      if (g) return `<div class="game-box">${side === "A" ? g.a : g.b}</div>`;
      const isLiveSlot = isActive && !isDone && idx === m.currentGameIndex;
      if (isLiveSlot) {
        const val = side === "A" ? m.live.a : m.live.b;
        return `<div class="game-box live">${val}</div>`;
      }
      return `<div class="game-box empty">–</div>`;
    };

    const winnerLine = isDone
      ? `<div class="winner-line">🏆 Menang: ${escapeHtml(m.winner === "A" ? m.teamA : m.teamB)} (${won.a}-${won.b})</div>`
      : `<div style="font-size:12px;color:var(--muted);">Skor game: ${won.a} - ${won.b}</div>`;

    const scoreBtnAttrs = bothTeamsSet ? "" : `disabled title="Menunggu tim dari babak sebelumnya"`;

    return `
      <div class="${cardClasses.join(" ")}">
        <div class="match-card-head">
          <span class="status-badge">${statusText}</span>
          <button class="icon-btn" data-role="delete-match" data-match-id="${m.id}" title="Hapus pertandingan">✕</button>
        </div>

        <div class="game-headers">
          <span>Tim</span><span>G1</span><span>G2</span><span>G3</span>
        </div>
        <div class="team-row">
          <input class="team-name" type="text" placeholder="Menunggu pemenang" value="${escapeHtml(m.teamA)}"
                 data-role="team-name" data-match-id="${m.id}" data-side="A">
          ${gameCell(0, "A")}${gameCell(1, "A")}${gameCell(2, "A")}
        </div>
        <div class="team-row">
          <input class="team-name" type="text" placeholder="Menunggu pemenang" value="${escapeHtml(m.teamB)}"
                 data-role="team-name" data-match-id="${m.id}" data-side="B">
          ${gameCell(0, "B")}${gameCell(1, "B")}${gameCell(2, "B")}
        </div>

        <div class="match-footer">
          ${winnerLine}
          <button class="btn btn-secondary btn-sm" data-role="score-this" data-match-id="${m.id}" ${scoreBtnAttrs}>
            ▶ Live Score
          </button>
        </div>
      </div>`;
  }

  // ---------------------------------------------------------------------
  // Rendering: Games (live scoreboard) view
  // ---------------------------------------------------------------------
  function renderGames() {
    const container = document.getElementById("games-container");
    const m = getActiveMatch();

    if (!m) {
      container.innerHTML = `
        <div class="games-empty">
          <div class="big">🎯</div>
          <p>Belum ada pertandingan yang dipilih.</p>
          <p>Buka tab <strong>Bracket</strong>, lalu klik <strong>“▶ Live Score”</strong> pada salah satu pertandingan.</p>
          <button class="btn btn-primary" id="btn-go-bracket-empty">Buka Bracket</button>
        </div>`;
      document.getElementById("btn-go-bracket-empty").addEventListener("click", () => switchView("bracket"));
      return;
    }

    const won = gamesWon(m);
    const isDone = m.status === "done";
    const gameLabel = isDone
      ? `Pertandingan selesai (${won.a} - ${won.b})`
      : `Game ${m.currentGameIndex + 1} dari 3`;

    const historyParts = m.games.map((g, i) => g ? `<span>G${i + 1}: ${g.a}-${g.b}</span>` : "").filter(Boolean);

    // Every game after the first swaps which side each team appears on
    // (A vs B, then B vs A, then A vs B, ...) so teams alternate position
    // each time they finish a game. This is purely a display swap for the
    // live scoreboard — the underlying teamA/teamB identity, and the
    // bracket's per-game A/B columns, are never touched.
    const swapped = m.currentGameIndex % 2 === 1;
    const leftKey = swapped ? "b" : "a";
    const rightKey = swapped ? "a" : "b";
    const nameFor = (key) => (key === "a" ? m.teamA : m.teamB);

    const teamPanel = (key, placeholder) => `
      <div class="team-panel">
        <input class="team-title-input" type="text" data-role="team-name-live" data-key="${key}"
               value="${escapeHtml(nameFor(key))}" placeholder="${placeholder}">
        <input class="score-num-input" type="number" min="0" inputmode="numeric"
               id="live-score-${key}" data-role="score-input" data-key="${key}"
               value="${m.live[key]}" ${isDone ? "disabled" : ""}>
        <div class="score-btns">
          <button class="score-btn minus" data-role="dec" data-key="${key}" ${isDone ? "disabled" : ""}>−</button>
          <button class="score-btn plus" data-role="inc" data-key="${key}" ${isDone ? "disabled" : ""}>+</button>
        </div>
      </div>`;

    container.innerHTML = `
      <div class="scoreboard-wrap">
        <div class="scoreboard-header">
          <div class="round-label">${escapeHtml(m.round)}</div>
          <div class="game-label">${escapeHtml(nameFor(leftKey) || "Tim A")} vs ${escapeHtml(nameFor(rightKey) || "Tim B")}</div>
          <div class="game-label">${gameLabel}</div>
        </div>

        ${historyParts.length ? `<div class="game-history">${historyParts.join("")}</div>` : ""}

        ${isDone ? `<div class="done-banner">🏆 ${escapeHtml(m.winner === "A" ? m.teamA : m.teamB)} memenangkan pertandingan (${won.a}-${won.b})</div>` : ""}

        <div class="scoreboard">
          ${teamPanel(leftKey, "Nama Tim")}
          <div class="vs-label">VS</div>
          ${teamPanel(rightKey, "Nama Tim")}
        </div>

        <div class="scoreboard-actions">
          ${isDone
            ? `<button class="btn btn-secondary" id="btn-reopen-match">↺ Buka Kembali Pertandingan</button>`
            : `<button class="btn btn-secondary" id="btn-reset-live">↺ Reset Game Ini</button>
               <button class="btn btn-primary" id="btn-finish-game">✔ Selesaikan Game ${m.currentGameIndex + 1}</button>`
          }
          ${state.mode === "multiple" ? `<button class="btn btn-secondary" id="btn-back-to-bracket">← Kembali ke Bracket</button>` : ""}
        </div>
      </div>`;

    // wire up
    container.querySelectorAll("[data-role='inc']").forEach((el) => {
      el.addEventListener("click", (e) => adjustLiveScore(e.currentTarget.getAttribute("data-key"), 1));
    });
    container.querySelectorAll("[data-role='dec']").forEach((el) => {
      el.addEventListener("click", (e) => adjustLiveScore(e.currentTarget.getAttribute("data-key"), -1));
    });
    container.querySelectorAll("[data-role='score-input']").forEach((el) => {
      el.addEventListener("change", (e) => setLiveScore(e.target.getAttribute("data-key"), e.target.value));
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
    });
    container.querySelectorAll("[data-role='team-name-live']").forEach((el) => {
      el.addEventListener("input", (e) => setTeamNameLive(e.target.getAttribute("data-key"), e.target.value));
    });
    const finishBtn = document.getElementById("btn-finish-game");
    if (finishBtn) finishBtn.addEventListener("click", finishCurrentGame);
    const resetBtn = document.getElementById("btn-reset-live");
    if (resetBtn) resetBtn.addEventListener("click", resetLiveScore);
    const reopenBtn = document.getElementById("btn-reopen-match");
    if (reopenBtn) reopenBtn.addEventListener("click", reopenMatch);
    const backBtn = document.getElementById("btn-back-to-bracket");
    if (backBtn) backBtn.addEventListener("click", () => switchView("bracket"));
  }

  function adjustLiveScore(key, delta) {
    const m = getActiveMatch();
    if (!m || m.status === "done") return;
    m.live[key] = Math.max(0, m.live[key] + delta);
    if (m.status === "pending") m.status = "in_progress";
    saveState();
    // Light-touch update for the Games view: just refresh the two numbers
    // instead of a full re-render, so +/- stays snappy on rapid clicks.
    document.getElementById("live-score-" + key).value = m.live[key];
    // But keep the Bracket view's game-box in sync too, so whichever match
    // is being live-scored shows its current score there in real time —
    // whether the bracket happens to be visible right now or you switch to
    // it mid-game.
    if (state.mode === "multiple") renderBracket();
  }

  function setLiveScore(key, rawValue) {
    const m = getActiveMatch();
    if (!m || m.status === "done") return;
    let val = parseInt(rawValue, 10);
    if (!Number.isFinite(val) || val < 0) val = 0;
    m.live[key] = val;
    if (m.status === "pending") m.status = "in_progress";
    saveState();
    document.getElementById("live-score-" + key).value = val;
    if (state.mode === "multiple") renderBracket();
  }

  function setTeamNameLive(key, value) {
    const m = getActiveMatch();
    if (!m) return;
    if (key === "a") m.teamA = value; else m.teamB = value;
    saveState();
    if (state.mode === "multiple") renderBracket();
  }

  function resetLiveScore() {
    const m = getActiveMatch();
    if (!m) return;
    m.live = { a: 0, b: 0 };
    saveState();
    renderGames();
  }

  function finishCurrentGame() {
    const m = getActiveMatch();
    if (!m || m.status === "done") return;
    if (m.live.a === m.live.b) {
      alert("Skor game ini masih imbang. Selesaikan hingga ada pemenang game sebelum melanjutkan.");
      return;
    }
    m.games[m.currentGameIndex] = { a: m.live.a, b: m.live.b };
    m.live = { a: 0, b: 0 };

    const won = gamesWon(m);
    if (won.a === 2 || won.b === 2) {
      m.status = "done";
      m.winner = won.a === 2 ? "A" : "B";

      // Advance the winner's name straight into the next round's bracket
      // slot, cascading the hierarchy down automatically.
      if (m.nextMatchId) {
        const nextMatch = state.matches.find((mm) => mm.id === m.nextMatchId);
        if (nextMatch) {
          const winnerName = m.winner === "A" ? m.teamA : m.teamB;
          if (m.nextMatchSlot === "A") nextMatch.teamA = winnerName;
          else nextMatch.teamB = winnerName;
        }
      }
    } else {
      m.currentGameIndex = Math.min(m.currentGameIndex + 1, 2);
      m.status = "in_progress";
    }
    saveState();
    renderGames();
    if (state.mode === "multiple") renderBracket(); // keep the bracket's mini score table (and next round) in sync
  }

  function reopenMatch() {
    const m = getActiveMatch();
    if (!m) return;
    if (!confirm("Buka kembali pertandingan ini untuk koreksi skor?")) return;

    // If the winner already advanced into the next round and that next
    // match hasn't started yet, retract the name so it doesn't go stale.
    // (If the next match is already underway, leave it — that needs a
    // manual fix, since we don't know if it's safe to unwind further.)
    if (m.status === "done" && m.nextMatchId) {
      const nextMatch = state.matches.find((mm) => mm.id === m.nextMatchId);
      if (nextMatch && nextMatch.status === "pending") {
        const advancedName = m.winner === "A" ? m.teamA : m.teamB;
        if (m.nextMatchSlot === "A" && nextMatch.teamA === advancedName) nextMatch.teamA = "";
        if (m.nextMatchSlot === "B" && nextMatch.teamB === advancedName) nextMatch.teamB = "";
      }
    }

    m.status = m.games.some(Boolean) ? "in_progress" : "pending";
    m.winner = null;
    // step back into the last completed game so it can be corrected
    const lastPlayed = m.games.map((g, i) => (g ? i : -1)).filter((i) => i >= 0).pop();
    if (lastPlayed !== undefined) {
      m.currentGameIndex = lastPlayed;
      m.live = { a: m.games[lastPlayed].a, b: m.games[lastPlayed].b };
      m.games[lastPlayed] = null;
    }
    saveState();
    renderGames();
    if (state.mode === "multiple") renderBracket();
  }

  // ---------------------------------------------------------------------
  // View switching / top-level render
  // ---------------------------------------------------------------------
  function switchView(view) {
    state.currentView = view;
    saveState();
    renderAll();
  }

  function renderAll() {
    const modeChosen = state.mode !== null;
    document.getElementById("view-mode-select").classList.toggle("active", !modeChosen);
    document.getElementById("mode-tabs").style.display = state.mode === "multiple" ? "flex" : "none";
    document.getElementById("btn-change-mode").style.display = modeChosen ? "inline-block" : "none";

    if (!modeChosen) {
      document.getElementById("view-bracket").classList.remove("active");
      document.getElementById("view-games").classList.remove("active");
      return;
    }

    if (state.mode === "single") {
      document.getElementById("view-bracket").classList.remove("active");
      document.getElementById("view-games").classList.add("active");
      renderGames();
      return;
    }

    // Multiple Game mode: normal Bracket / Games tabs.
    document.getElementById("tab-bracket").classList.toggle("active", state.currentView === "bracket");
    document.getElementById("tab-games").classList.toggle("active", state.currentView === "games");
    document.getElementById("view-bracket").classList.toggle("active", state.currentView === "bracket");
    document.getElementById("view-games").classList.toggle("active", state.currentView === "games");
    renderBracket();
    renderGames();
  }

  // ---------------------------------------------------------------------
  // Bracket generator (replaces the old one-match-at-a-time modal): picking
  // a size and clicking the button creates the whole cascading bracket in
  // one go, pre-filled with "Tim 1".."Tim N".
  // ---------------------------------------------------------------------
  document.getElementById("btn-generate-bracket").addEventListener("click", () => {
    const size = parseInt(document.getElementById("bracket-size-select").value, 10);
    if (state.matches.length > 0) {
      const ok = confirm(`Ini akan MENGGANTI seluruh bracket saat ini dengan bracket baru berisi ${size} tim. Lanjutkan?`);
      if (!ok) return;
    }
    state.matches = generateBracket(size);
    state.activeMatchId = null;
    saveState();
    renderAll();
  });

  // ---------------------------------------------------------------------
  // Mode select
  // ---------------------------------------------------------------------
  document.getElementById("btn-mode-single").addEventListener("click", () => {
    state.mode = "single";
    ensureSingleMatch();
    state.currentView = "games";
    saveState();
    renderAll();
  });

  document.getElementById("btn-mode-multiple").addEventListener("click", () => {
    state.mode = "multiple";
    ensureDefaultBracket();
    state.currentView = "bracket";
    saveState();
    renderAll();
  });

  document.getElementById("btn-change-mode").addEventListener("click", () => {
    if (!confirm("Kembali ke menu pilih mode? Data yang sudah ada akan tetap tersimpan.")) return;
    state.mode = null;
    saveState();
    renderAll();
  });

  // ---------------------------------------------------------------------
  // Top-level nav + reset
  // ---------------------------------------------------------------------
  document.querySelectorAll("nav.tabs button").forEach((btn) => {
    btn.addEventListener("click", () => switchView(btn.getAttribute("data-view")));
  });

  document.getElementById("btn-reset-all").addEventListener("click", () => {
    if (!confirm("Hapus SEMUA pertandingan dan skor, lalu kembali ke menu pilih mode?")) return;
    state = { mode: null, matches: [], activeMatchId: null, currentView: "bracket", singleMatch: null };
    saveState();
    renderAll();
  });

  // ---------------------------------------------------------------------
  // Boot — resume whichever mode (and data) was last saved. If a bracket
  // was already in progress, keep it ready to go the moment Multiple Game
  // is (re-)selected; same for an in-progress single game.
  // ---------------------------------------------------------------------
  if (state.mode === "multiple") ensureDefaultBracket();
  if (state.mode === "single") ensureSingleMatch();
  renderAll();
})();
</script>
</body>
</html>
